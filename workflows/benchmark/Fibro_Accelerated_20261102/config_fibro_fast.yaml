  - ExtraTrees
  - ElasticNet
  - MLP
  - Ridge
  - Lasso
  - RandomForest
  - GradientBoosting
  - Supervised_PCA_Ridge
  - SVR
  - DeepSets
  - Pseudobulk
  - Ensemble
  tune_linear: true
  linear_alphas:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  l1_ratios:
  - 0.1
  - 0.3
  - 0.5
  - 0.7
  max_iter: 100000
  xgb_estimators: 1500
  tree_estimators: 800
  boost_estimators: 500
  mlp_max_iter: 3000
